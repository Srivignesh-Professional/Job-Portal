<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My Jobs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center">
    <h3>My Job Posts</h3>
    <div class="d-flex gap-2 flex-wrap">
      <a class="btn btn-primary" th:href="@{/employer/jobs/new}">+ Create Job</a>
      <a class="btn btn-outline-secondary" th:href="@{/employer/dashboard}">Dashboard</a>
    </div>
  </div>

  <div class="mt-4" th:if="${#lists.isEmpty(jobs)}">
    <div class="alert alert-info">No jobs posted yet.</div>
  </div>

  <table class="table table-striped mt-3" th:if="${!#lists.isEmpty(jobs)}">
    <thead>
    <tr>
      <th>Title</th>
      <th>City</th>
      <th>Category</th>
      <th>Status</th>
      <th>Wage</th>
      <th class="text-end">Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="j : ${jobs}">
      <td th:text="${j.title}">Title</td>
      <td th:text="${j.city.name}">City</td>
      <td th:text="${j.category.name}">Category</td>
      <td>
        <span class="badge"
              th:classappend="${j.status.name() == 'PUBLISHED'} ? 'bg-success' : 'bg-secondary'"
              th:text="${j.status}">
        </span>
      </td>
      <td th:text="${j.wageType + ' ₹' + j.wageAmount}">Wage</td>

      <td class="text-end">
        <div class="d-inline-flex gap-2 flex-wrap justify-content-end">

          <!-- Optional: view public job page -->
          <a class="btn btn-sm btn-outline-secondary"
             th:href="@{/jobs/{id}(id=${j.id})}">
            View
          </a>

          <!-- Applicants -->
          <a class="btn btn-sm btn-outline-info"
             th:href="@{/employer/jobs/{id}/applications(id=${j.id})}">
            Applicants
          </a>

          <!-- Close job (only if published) -->
          <form th:if="${j.status.name() == 'PUBLISHED'}"
                th:action="@{/employer/jobs/{id}/close(id=${j.id})}"
                method="post" class="m-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn btn-sm btn-outline-danger" type="submit">Close</button>
          </form>

        </div>
      </td>
      <td>
        <a th:href="@{/employer/jobs/{id}/applications(id=${j.id})}" class="btn btn-sm btn-outline-info">
          Applicants
          <span class="badge bg-secondary ms-1"
                th:text="${applicantCounts[j.id] != null ? applicantCounts[j.id] : 0}">0</span>
        </a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
