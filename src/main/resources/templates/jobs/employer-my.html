<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My Jobs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center">
    <h3>My Job Posts</h3>
    <div>
      <a class="btn btn-primary" th:href="@{/employer/jobs/new}">+ Create Job</a>
      <a class="btn btn-outline-secondary" th:href="@{/employer/dashboard}">Dashboard</a>
    </div>
  </div>

  <div class="mt-4" th:if="${#lists.isEmpty(jobs)}">
    <div class="alert alert-info">No jobs posted yet.</div>
  </div>

  <table class="table table-striped mt-3" th:if="${!#lists.isEmpty(jobs)}">
    <thead>
    <tr>
      <th>Title</th>
      <th>City</th>
      <th>Category</th>
      <th>Status</th>
      <th>Wage</th>
      <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="j: ${jobs}">
      <td th:text="${j.title}">Title</td>
      <td th:text="${j.city.name}">City</td>
      <td th:text="${j.category.name}">Category</td>
      <td th:text="${j.status}">Status</td>
      <td th:text="${j.wageType + ' ₹' + j.wageAmount}">Wage</td>
      <td class="text-end">
        <form th:if="${j.status.name() == 'PUBLISHED'}"
              th:action="@{/employer/jobs/{id}/close(id=${j.id})}" method="post">
          <button class="btn btn-sm btn-outline-danger" type="submit">Close</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
