<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Create Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 760px;">
    <h3>Create Job Post</h3>

    <form class="card card-body mt-3" th:action="@{/employer/jobs}" th:object="${form}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input class="form-control" th:field="*{title}"/>
            <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Category</label>
                <select class="form-select" th:field="*{categoryId}">
                    <option value="">-- Select --</option>
                    <option th:each="cat: ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
                <div class="text-danger" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">City</label>
                <select class="form-select" th:field="*{cityId}">
                    <option value="">-- Select --</option>
                    <option th:each="c: ${cities}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
                <div class="text-danger" th:if="${#fields.hasErrors('cityId')}" th:errors="*{cityId}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}" rows="4"></textarea>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Wage Type</label>
                <select class="form-select" th:field="*{wageType}">
                    <option value="">-- Select --</option>
                    <option th:each="w: ${wageTypes}" th:value="${w}" th:text="${w}"></option>
                </select>
                <div class="text-danger" th:if="${#fields.hasErrors('wageType')}" th:errors="*{wageType}"></div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Wage Amount</label>
                <input class="form-control" th:field="*{wageAmount}" />
                <div class="text-danger" th:if="${#fields.hasErrors('wageAmount')}" th:errors="*{wageAmount}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Work Date (optional)</label>
            <input class="form-control" type="date" th:field="*{workDate}" />
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <button class="btn btn-primary" type="submit">Publish</button>
        <a class="btn btn-outline-secondary ms-2" th:href="@{/employer/jobs}">Cancel</a>
    </form>
</div>
</body>
</html>
