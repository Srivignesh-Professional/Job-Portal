<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Job Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <a class="btn btn-link" th:href="@{/jobs}">← Back to jobs</a>

    <div class="card mt-2">
        <div class="card-body">
            <h3 th:text="${job.title}">Title</h3>

            <div class="mb-2">
                <span class="badge bg-secondary" th:text="${job.category.name}">Category</span>
                <span class="badge bg-primary" th:text="${job.city.name}">City</span>
                <span class="badge bg-success" th:text="${job.wageType + ' ₹' + job.wageAmount}">Wage</span>
                <span class="badge bg-light text-dark" th:if="${job.workDate != null}" th:text="${job.workDate}">Date</span>
            </div>

            <p class="mt-3" th:text="${job.description}">Description</p>

            <form sec:authorize="hasRole('WORKER')"
                  th:action="@{/jobs/{id}/apply(id=${job.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="btn btn-success" type="submit">Apply</button>
            </form>

            <a sec:authorize="isAnonymous()" class="btn btn-success" th:href="@{/login}">
                Login to Apply
            </a>

            <div sec:authorize="hasRole('EMPLOYER')" class="alert alert-info mt-3">
                Employers cannot apply to jobs.
            </div>
        </div>
    </div>
</div>
<div th:replace="layout/chat-widget :: widget"></div>
</body>
</html>
