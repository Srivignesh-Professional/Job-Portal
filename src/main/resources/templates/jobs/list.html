<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Jobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-4">

    <!-- Flash / Info messages -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center">
        <h3 class="mb-0">Jobs</h3>

        <div class="d-flex flex-wrap gap-2">

            <!-- Anonymous -->
            <div sec:authorize="isAnonymous()">
                <a class="btn btn-outline-primary" th:href="@{/login}">Login</a>
                <a class="btn btn-primary" th:href="@{/register}">Register</a>
            </div>

            <!-- Worker -->
            <div sec:authorize="hasRole('WORKER')" class="d-flex flex-wrap gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/worker/profile}">My Profile</a>
                <a class="btn btn-info" th:href="@{/worker/applications}">My Applications</a>

                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button class="btn btn-outline-danger" type="submit">Logout</button>
                </form>
            </div>

            <!-- Employer -->
            <div sec:authorize="hasRole('EMPLOYER')" class="d-flex flex-wrap gap-2">
                <a class="btn btn-primary" th:href="@{/employer/jobs/new}">Post a Job</a>
                <a class="btn btn-outline-secondary" th:href="@{/employer/jobs}">My Job Posts</a>

                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button class="btn btn-outline-danger" type="submit">Logout</button>
                </form>
            </div>

        </div>
    </div>

    <!-- Filters -->
    <form class="row g-2 mt-3" th:action="@{/jobs}" th:object="${search}" method="get">
        <div class="col-md-5">
            <select class="form-select" th:field="*{cityId}">
                <option value="">All Cities</option>
                <option th:each="c: ${cities}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
        </div>
        <div class="col-md-5">
            <select class="form-select" th:field="*{categoryId}">
                <option value="">All Categories</option>
                <option th:each="cat: ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
        </div>
        <div class="col-md-2 d-grid">
            <button class="btn btn-primary" type="submit">Filter</button>
        </div>
    </form>

    <!-- Empty state -->
    <div class="mt-4" th:if="${jobsPage == null || jobsPage.totalElements == 0}">
        <div class="alert alert-info">No jobs found.</div>
    </div>

    <!-- Jobs list -->
    <div class="list-group mt-3" th:if="${jobsPage != null && jobsPage.totalElements > 0}">
        <a class="list-group-item list-group-item-action"
           th:each="j : ${jobsPage.content}"
           th:href="@{/jobs/{id}(id=${j.id})}">

            <div class="d-flex w-100 justify-content-between">
                <h5 class="mb-1" th:text="${j.title}">Title</h5>
                <small th:text="${j.city.name}">City</small>
            </div>

            <div class="mb-1">
                <span class="badge bg-secondary" th:text="${j.category.name}">Category</span>
                <span class="badge bg-success" th:text="${j.wageType + ' ₹' + j.wageAmount}">Wage</span>
                <span class="badge bg-light text-dark" th:if="${j.workDate != null}" th:text="${j.workDate}">Date</span>
            </div>
        </a>
    </div>

    <!-- Pagination -->
    <nav class="mt-4" th:if="${jobsPage != null && jobsPage.totalPages > 1}">
        <ul class="pagination justify-content-center">

            <!-- Prev -->
            <li class="page-item" th:classappend="${jobsPage.first} ? 'disabled'">
                <a class="page-link"
                   th:if="${!jobsPage.first}"
                   th:href="@{/jobs(page=${jobsPage.number - 1}, size=${pageSize}, cityId=${search.cityId}, categoryId=${search.categoryId})}">
                    Prev
                </a>
                <span class="page-link" th:if="${jobsPage.first}">Prev</span>
            </li>

            <!-- Current page indicator -->
            <li class="page-item disabled">
                <span class="page-link"
                      th:text="${jobsPage.number + 1} + ' / ' + ${jobsPage.totalPages}">
                    1 / 1
                </span>
            </li>

            <!-- Next -->
            <li class="page-item" th:classappend="${jobsPage.last} ? 'disabled'">
                <a class="page-link"
                   th:if="${!jobsPage.last}"
                   th:href="@{/jobs(page=${jobsPage.number + 1}, size=${pageSize}, cityId=${search.cityId}, categoryId=${search.categoryId})}">
                    Next
                </a>
                <span class="page-link" th:if="${jobsPage.last}">Next</span>
            </li>

        </ul>
    </nav>

</div>
<div th:replace="layout/chat-widget :: widget"></div>
</body>
</html>
