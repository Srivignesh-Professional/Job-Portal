<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Jobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center">
        <h3>Jobs</h3>
        <a class="btn btn-outline-secondary" th:href="@{/}">Home</a>
    </div>

    <form class="row g-2 mt-3" th:action="@{/jobs}" th:object="${search}" method="get">
        <div class="col-md-5">
            <select class="form-select" th:field="*{cityId}">
                <option value="">All Cities</option>
                <option th:each="c: ${cities}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
        </div>
        <div class="col-md-5">
            <select class="form-select" th:field="*{categoryId}">
                <option value="">All Categories</option>
                <option th:each="cat: ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
        </div>
        <div class="col-md-2 d-grid">
            <button class="btn btn-primary" type="submit">Filter</button>
        </div>
    </form>

    <div class="mt-4" th:if="${#lists.isEmpty(jobs)}">
        <div class="alert alert-info">No jobs found.</div>
    </div>

    <div class="list-group mt-3">
        <a class="list-group-item list-group-item-action"
           th:each="j : ${jobs}"
           th:href="@{/jobs/{id}(id=${j.id})}">
            <div class="d-flex w-100 justify-content-between">
                <h5 class="mb-1" th:text="${j.title}">Title</h5>
                <small th:text="${j.city.name}">City</small>
            </div>
            <div class="mb-1">
                <span class="badge bg-secondary" th:text="${j.category.name}">Category</span>
                <span class="badge bg-success" th:text="${j.wageType + ' ₹' + j.wageAmount}">Wage</span>
                <span class="badge bg-light text-dark" th:if="${j.workDate != null}" th:text="${j.workDate}">Date</span>
            </div>
        </a>
    </div>
</div>
</body>
</html>
