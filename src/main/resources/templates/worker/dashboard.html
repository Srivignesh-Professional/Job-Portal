<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Worker Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center">
        <h3>Worker Dashboard</h3>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/worker/profile}">Edit Profile</a>
            <a class="btn btn-success" th:href="@{/jobs}">Find Jobs</a>
            <a class="btn btn-info" th:href="@{/worker/applications}">My Applications</a>
            <!--<a class="btn btn-outline-danger" th:href="@{/logout}">Logout</a>-->
            <form th:action="@{/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="btn btn-outline-danger" type="submit">Logout</button>
            </form>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <div><b>Name:</b> <span th:text="${profile.fullName}">-</span></div>

            <div>
                <b>Preferred Cities:</b>
                <span th:if="${#lists.isEmpty(profile.preferredCities)}">-</span>
                <th:block th:each="city, iter : ${profile.preferredCities}">
                    <span class="badge bg-primary me-1" th:text="${city.name}"></span>
                </th:block>
            </div>

            <div><b>Availability:</b> <span th:text="${profile.availability}">-</span></div>
        </div>
    </div>

    <p class="text-muted mt-3">Phase 3 will add job search + apply.</p>
</div>
</body>
</html>
