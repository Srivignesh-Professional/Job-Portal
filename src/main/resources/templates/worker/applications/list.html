<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>My Applications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h3>My Applications</h3>
  <div th:each="app : ${applications}" class="card mb-3">
    <div class="card-body">
      <h5 th:text="${app.jobPost.title}"></h5>
      <p th:text="${app.jobPost.description}"></p>
      <p>Location: <span th:text="${app.jobPost.city.name}"></span> | Status: <span th:text="${app.status}"></span></p>
      <p>Applied: <span th:text="${app.appliedAt}"></span></p>
    </div>
  </div>
  <a th:href="@{/jobs}" class="btn btn-primary">Find More Jobs</a>
</div>
</body>
</html>
