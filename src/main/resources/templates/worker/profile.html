<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Worker Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 720px;">
    <h3>Worker Profile</h3>
    <p class="text-muted">Please complete your profile to continue.</p>

    <form th:action="@{/worker/profile}" th:object="${form}" method="post" class="card card-body">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input class="form-control" th:field="*{fullName}" />
            <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Preferred Cities
                <small class="text-muted">(Hold Ctrl / Cmd to select multiple)</small>
            </label>
            <select class="form-select" th:field="*{preferredCityIds}" multiple size="8">
                <option th:each="c : ${cities}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('preferredCityIds')}" th:errors="*{preferredCityIds}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Availability</label>
            <select class="form-select" th:field="*{availability}">
                <option value="">-- Select --</option>
                <option th:each="a : ${availabilities}" th:value="${a}" th:text="${a}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('availability')}" th:errors="*{availability}"></div>
        </div>

        <button class="btn btn-primary" type="submit">Save Profile</button>
        <a class="btn btn-outline-secondary ms-2" th:href="@{/logout}">Logout</a>
    </form>
</div>
</body>
</html>
