<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="widget" sec:authorize="isAuthenticated()">

    <!-- CSRF meta for fetch -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <style>
        #chatFab { position: fixed; right: 20px; bottom: 20px; z-index: 1050; }
        #chatBox {
          position: fixed; right: 20px; bottom: 80px;
          width: 340px; max-width: calc(100vw - 40px);
          height: 420px; background: #fff; border: 1px solid #ddd;
          border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
          z-index: 1050; display: none; overflow: hidden;
        }
        #chatHeader { background:#0d6efd; color:#fff; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; }
        #chatMessages { padding: 12px; height: 310px; overflow-y: auto; background:#f8f9fa; }
        .msg { margin-bottom: 10px; }
        .msg .bubble { display:inline-block; padding:8px 10px; border-radius: 10px; max-width: 90%; white-space: pre-wrap; }
        .msg.user { text-align:right; }
        .msg.user .bubble { background:#0d6efd; color:#fff; }
        .msg.bot .bubble { background:#fff; border:1px solid #e1e1e1; }
        #chatInputBar { padding: 10px; border-top:1px solid #eee; }
    </style>

    <button id="chatFab" class="btn btn-primary">Chat</button>

    <div id="chatBox">
        <div id="chatHeader">
            <div>Assistant</div>
            <button type="button" id="chatClose" class="btn btn-sm btn-light">X</button>
        </div>

        <div id="chatMessages"></div>

        <div id="chatInputBar">
            <div class="input-group">
                <input id="chatInput" class="form-control" placeholder="Type a message..." />
                <button id="chatSend" class="btn btn-primary" type="button">Send</button>
            </div>
            <div class="text-muted mt-1" style="font-size: 12px;">
                Try: find jobs / post a job / my applications
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const fab = document.getElementById('chatFab');
        const box = document.getElementById('chatBox');
        const closeBtn = document.getElementById('chatClose');
        const sendBtn = document.getElementById('chatSend');
        const input = document.getElementById('chatInput');
        const messages = document.getElementById('chatMessages');

        const CSRF_HEADER = /*[[${_csrf.headerName}]]*/ "X-CSRF-TOKEN";
        const CSRF_TOKEN  = /*[[${_csrf.token}]]*/ "";

        function escapeHtml(str) {
          return (str || '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
        }

        function linkify(str) {
          const escaped = escapeHtml(str);

          // linkify absolute URLs and relative paths like /jobs?cityId=1
          const regex = /(\bhttps?:\/\/[^\s]+|\/[^\s]+)/g;

          return escaped.replace(regex, (url) =>
            `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`
          );
        }

        function addMsg(sender, text) {
          const row = document.createElement('div');
          row.className = 'msg ' + sender;

          const bubble = document.createElement('div');
          bubble.className = 'bubble';

          if (sender === 'bot') {
            bubble.innerHTML = linkify(text);
          } else {
            // never render user HTML
            bubble.textContent = text;
          }

          row.appendChild(bubble);
          messages.appendChild(row);
          messages.scrollTop = messages.scrollHeight;
        }

        function getCsrf() {
          return {
            token: CSRF_TOKEN,
            header: CSRF_HEADER
          };
        }

        async function send() {
          const text = (input.value || '').trim();
          if (!text) return;

          input.value = '';
          addMsg('user', text);

          const csrf = getCsrf();

          const res = await fetch('/chat/message', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              [csrf.header]: csrf.token
            },
            body: JSON.stringify({ message: text })
          });

          if (!res.ok) {
            addMsg('bot', 'Error: could not reach assistant.');
            return;
          }

          const data = await res.json();
          addMsg('bot', data.reply);
        }

        fab.addEventListener('click', () => {
          box.style.display =
            (box.style.display === 'none' || !box.style.display)
              ? 'block'
              : 'none';

          if (messages.childElementCount === 0) {
            addMsg('bot', 'Hi! How can I help you today?');
          }
        });

        closeBtn.addEventListener('click', () => {
          box.style.display = 'none';
        });

        sendBtn.addEventListener('click', send);

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') send();
        });
    </script>

</div>

</body>
</html>
