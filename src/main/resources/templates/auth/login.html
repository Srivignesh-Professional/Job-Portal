<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 420px;">
    <div class="card">
        <div class="card-body">
            <h3 class="mb-3">Login</h3>

            <div th:if="${param.registered}" class="alert alert-success">Registration successful. Please login.</div>
            <div th:if="${param.error}" class="alert alert-danger">Invalid phone/password.</div>
            <div th:if="${param.logout}" class="alert alert-info">Logged out.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input class="form-control" type="text" name="phone" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input class="form-control" type="password" name="password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Login</button>
            </form>

            <div class="mt-3">
                <a th:href="@{/register}">Create account</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
