<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts - Poppins (modern & clean) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #8B5CF6;      /* Violet - modern, premium, not blue */
            --primary-dark: #7C3AED;
            --primary-light: #ddd6fe;
            --text-dark: #4c1d95;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8f5ff 0%, #ede9fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            margin: 0;
            background-attachment: fixed;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            animation: fadeSlideUp 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.15);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px rgba(139, 92, 246, 0.22);
        }

        .card-body {
            padding: 3rem 2.5rem;
        }

        h3 {
            font-weight: 700;
            font-size: 1.85rem;
            color: var(--text-dark);
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* Floating labels with smooth color transition */
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: var(--primary);
            font-weight: 500;
        }

        .form-floating > .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(139, 92, 246, 0.18);
        }

        /* Custom primary button - violet */
        .btn-login {
            background: var(--primary);
            border: none;
            border-radius: 16px;
            padding: 0.9rem 1rem;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(139, 92, 246, 0.35);
        }

        .btn-login:active {
            transform: translateY(-1px);
        }

        /* Alert animations */
        .alert {
            border: none;
            border-radius: 14px;
            padding: 1rem 1.25rem;
            font-weight: 500;
            animation: slideDown 0.5s ease-out;
        }

        .alert-success { background: #dcfce7; color: #166534; }
        .alert-danger { background: #fee2e2; color: #991b1b; }
        .alert-info { background: #dbeafe; color: #1e40af; }

        /* Register link */
        .register-link {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .register-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* Animations */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .card-body {
                padding: 2.5rem 2rem;
            }
            h3 { font-size: 1.7rem; }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div class="card-body">

            <div class="text-center mb-4">
                <h3>Welcome Back</h3>
                <p class="subtitle">Sign in to continue to your account</p>
            </div>

            <div th:if="${param.registered}" class="alert alert-success mb-4" role="alert">
                Registration successful. Please login.
            </div>
            <div th:if="${param.error}" class="alert alert-danger mb-4" role="alert">
                Invalid phone/password.
            </div>
            <div th:if="${param.logout}" class="alert alert-info mb-4" role="alert">
                Logged out.
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="phone" name="phone" placeholder="Phone Number" required autocomplete="tel">
                    <label for="phone">Phone Number</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                    <label for="password">Password</label>
                </div>

                <button class="btn btn-login w-100" type="submit">Login</button>
            </form>

            <div class="mt-4 text-center">
                <span class="text-muted">Don't have an account? </span>
                <a th:href="@{/register}" class="register-link">Create account</a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
