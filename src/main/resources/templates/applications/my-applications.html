<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My Applications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center">
        <h3>My Applications</h3>
        <div>
            <a class="btn btn-outline-primary" th:href="@{/jobs}">Browse Jobs</a>
            <a class="btn btn-outline-secondary" th:href="@{/worker/dashboard}">Dashboard</a>
        </div>
    </div>

    <div class="mt-4" th:if="${#lists.isEmpty(applications)}">
        <div class="alert alert-info">No applications yet.</div>
    </div>

    <div class="list-group mt-3" th:if="${!#lists.isEmpty(applications)}">
        <div class="list-group-item" th:each="a : ${applications}">
            <div class="d-flex justify-content-between">
                <div>
                    <div><b th:text="${a.jobPost.title}">Job title</b></div>
                    <small class="text-muted">
                        <span th:text="${a.jobPost.city.name}">City</span> •
                        <span th:text="${a.jobPost.category.name}">Category</span>
                    </small>
                </div>
                <span class="badge bg-secondary" th:text="${a.status}">APPLIED</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
