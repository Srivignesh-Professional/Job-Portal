<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Applicants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h3 class="mb-1">Applicants</h3>
            <div class="text-muted">
                Job: <b th:text="${job.title}">Job title</b>
            </div>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/employer/jobs}">Back to My Jobs</a>
    </div>

    <div class="alert alert-info mt-4" th:if="${#lists.isEmpty(applicants)}">
        No applications received yet.
    </div>

    <table class="table table-striped mt-4" th:if="${!#lists.isEmpty(applicants)}">
        <thead>
        <tr>
            <th>Worker</th>
            <th>Phone</th>
            <th>Availability</th>
            <th>Applied At</th>
            <th>Status</th>
            <th class="text-end">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${applicants}">
            <td th:text="${a.workerName != null ? a.workerName : 'Worker'}">Name</td>
            <td th:text="${a.workerPhone}">Phone</td>
            <td th:text="${a.availability != null ? a.availability : '-'}">Availability</td>
            <td th:text="${a.appliedAt}">Applied</td>
            <td><span class="badge bg-secondary" th:text="${a.status}">APPLIED</span></td>
            <td class="text-end">
<!--                <form th:action="@{/employer/jobs/{jobId}/applications/{appId}/status(jobId=${job.id}, appId=${a.applicationId})}"-->
<!--                      method="post" class="d-inline">-->
<!--                    <input type="hidden" name="status" value="HIRED"/>-->
<!--                    <button class="btn btn-sm btn-success" type="submit">Hire</button>-->
<!--                </form>-->
<!--                <form th:action="@{/employer/jobs/{jobId}/applications/{appId}/status(jobId=${job.id}, appId=${a.applicationId})}"-->
<!--                      method="post" class="d-inline ms-1">-->
<!--                    <input type="hidden" name="status" value="REJECTED"/>-->
<!--                    <button class="btn btn-sm btn-outline-danger" type="submit">Reject</button>-->
<!--                </form>-->
                <button type="button"
                        class="btn btn-sm btn-success"
                        data-bs-toggle="modal"
                        data-bs-target="#confirmModal"
                        th:attr="data-action='HIRED',
                   data-job-id=${job.id},
                   data-app-id=${a.applicationId},
                   data-name=${a.workerName},
                   data-phone=${a.workerPhone}">
                    Hire
                </button>

                <button type="button"
                        class="btn btn-sm btn-outline-danger ms-1"
                        data-bs-toggle="modal"
                        data-bs-target="#confirmModal"
                        th:attr="data-action='REJECTED',
                   data-job-id=${job.id},
                   data-app-id=${a.applicationId},
                   data-name=${a.workerName},
                   data-phone=${a.workerPhone}">
                    Reject
                </button>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Confirmation Modal (single modal for entire page) -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="confirmTitle">Confirm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p id="confirmText" class="mb-0"></p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>

                    <form id="confirmForm" method="post" class="m-0">
                        <input type="hidden" name="status" id="confirmStatus"/>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <button type="submit" class="btn btn-primary" id="confirmButton">Confirm</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const modalEl = document.getElementById('confirmModal');

    modalEl.addEventListener('show.bs.modal', function (event) {
      const btn = event.relatedTarget;

      const action = btn.getAttribute('data-action');     // HIRED or REJECTED
      const jobId = btn.getAttribute('data-job-id');
      const appId = btn.getAttribute('data-app-id');
      const name = btn.getAttribute('data-name') || 'Worker';
      const phone = btn.getAttribute('data-phone') || '-';

      document.getElementById('confirmTitle').textContent =
        (action === 'HIRED') ? 'Confirm Hire' : 'Confirm Reject';

      document.getElementById('confirmText').textContent =
        `Are you sure you want to ${(action === 'HIRED') ? 'hire' : 'reject'} ${name} (${phone})?`;

      document.getElementById('confirmStatus').value = action;

      const form = document.getElementById('confirmForm');
      form.action = `/employer/jobs/${jobId}/applications/${appId}/status`;

      const confirmBtn = document.getElementById('confirmButton');
      confirmBtn.className = (action === 'HIRED') ? 'btn btn-success' : 'btn btn-danger';
      confirmBtn.textContent = (action === 'HIRED') ? 'Hire' : 'Reject';
    });
</script>
<div th:replace="layout/chat-widget :: widget"></div>
</body>

</html>
