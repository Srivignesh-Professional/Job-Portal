<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Employer Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 720px;">
  <h3>Employer Profile</h3>
  <p class="text-muted">Please complete your profile to continue.</p>

  <form th:action="@{/employer/profile}" th:object="${form}" method="post" class="card card-body">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <div class="mb-3">
      <label class="form-label">Company Name</label>
      <input class="form-control" th:field="*{companyName}" />
      <div class="text-danger" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Contact Name</label>
      <input class="form-control" th:field="*{contactName}" />
    </div>

    <div class="mb-3">
      <label class="form-label">City</label>
      <select class="form-select" th:field="*{cityId}">
        <option value="">-- Select --</option>
        <option th:each="c : ${cities}" th:value="${c.id}" th:text="${c.name}"></option>
      </select>
      <div class="text-danger" th:if="${#fields.hasErrors('cityId')}" th:errors="*{cityId}"></div>
    </div>

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <div class="mb-3">
      <label class="form-label">Address Line</label>
      <input class="form-control" th:field="*{addressLine}" />
    </div>

    <button class="btn btn-primary" type="submit">Save Profile</button>
    <!--<a class="btn btn-outline-secondary ms-2" th:href="@{/logout}">Logout</a>-->
    <form th:action="@{/logout}" method="post" class="d-inline">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <button class="btn btn-outline-danger" type="submit">Logout</button>
    </form>
  </form>
</div>
</body>
</html>
