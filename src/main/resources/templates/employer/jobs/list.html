<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>My Jobs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="d-flex justify-content-between">
    <h3>My Job Posts</h3>
    <a th:href="@{/employer/jobs/create}" class="btn btn-primary">Post New Job</a>
  </div>

  <div th:each="job : ${jobs}" class="card mb-3">
    <div class="card-body">
      <h5 th:text="${job.title}"></h5>
      <p>Status: <span class="badge" th:classappend="${job.status == 'PUBLISHED'} ? 'bg-success' : 'bg-secondary'" th:text="${job.status}"></span></p>
      <p>Wage: ₹<span th:text="${job.wageAmount}"></span> <span th:text="${job.wageType}"></span> in <span th:text="${job.city.name}"></span></p>
      <div>
        <a th:href="@{/employer/jobs/{id}/edit(id=${job.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
        <th:block th:if="${job.status != 'CLOSED'}">
          <form th:action="@{/employer/jobs/{id}/publish(id=${job.id})}" method="post" style="display:inline;">
            <button class="btn btn-sm btn-success" th:if="${job.status == 'DRAFT'}" type="submit">Publish</button>
          </form>
          <form th:action="@{/employer/jobs/{id}/close(id=${job.id})}" method="post" style="display:inline;" th:if="${job.status != 'CLOSED'}">
            <button class="btn btn-sm btn-danger" type="submit">Close Job</button>
          </form>
        </th:block>
      </div>
    </div>
  </div>
</div>
</body>
</html>
