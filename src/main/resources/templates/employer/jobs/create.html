<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Create Job</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 800px;">
  <h3>Post New Job</h3>
  <form th:action="@{/employer/jobs/create}" th:object="${form}" method="post">
    <div class="mb-3">
      <label>Title</label>
      <input class="form-control" th:field="*{title}">
    </div>
    <div class="row">
      <div class="col">
        <label>Category</label>
        <select class="form-select" th:field="*{categoryId}">
          <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
        </select>
      </div>
      <div class="col">
        <label>City</label>
        <select class="form-select" th:field="*{cityId}">
          <option th:each="c : ${cities}" th:value="${c.id}" th:text="${c.name}"></option>
        </select>
      </div>
    </div>
    <div class="row mt-3">
      <div class="col">
        <label>Wage Type</label>
        <select class="form-select" th:field="*{wageType}">
          <option th:each="wt : ${wageTypes}" th:value="${wt}" th:text="${wt}"></option>
        </select>
      </div>
      <div class="col">
        <label>Amount (₹)</label>
        <input type="number" step="0.01" class="form-control" th:field="*{wageAmount}">
      </div>
    </div>
    <div class="mb-3 mt-3">
      <label>Work Date</label>
      <input type="date" class="form-control" th:field="*{workDate}">
    </div>
    <div class="mb-3">
      <label>Description</label>
      <textarea class="form-control" rows="5" th:field="*{description}"></textarea>
    </div>
    <button class="btn btn-primary">Create Draft</button>
  </form>
</div>
</body>
</html>
