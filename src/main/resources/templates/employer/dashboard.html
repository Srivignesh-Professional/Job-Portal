<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Employer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center">
        <h3>Employer Dashboard</h3>
        <div>
            <a class="btn btn-outline-secondary" th:href="@{/employer/profile}">Edit Profile</a>
            <a th:href="@{/employer/jobs}" class="btn btn-success mb-2">Post Job</a>
            <a class="btn btn-outline-danger" th:href="@{/logout}">Logout</a>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <div><b>Company:</b> <span th:text="${profile.companyName}"></span></div>
            <div><b>Contact:</b> <span th:text="${profile.contactName != null ? profile.contactName : '-'}"></span></div>
            <div><b>City:</b> <span th:text="${profile.city != null ? profile.city.name : '-'}"></span></div>
        </div>
    </div>

    <p class="text-muted mt-3">Phase 3 will add job posting + applicants.</p>
</div>
</body>
</html>
