spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/JobApplication?currentSchema=labour_portal
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
#        default_schema: labour_portal
        format_sql: true
  thymeleaf:
    cache: false
  messages:
    basename: messages
    encoding: UTF-8
  flyway:
    enabled: true
    schemas: labour_portal
    baseline-on-migrate: true
#    baseline-version: 1
    default-schema: labour_portal
    create-schemas: false


server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb: DEBUG

